#################
### AUTOSTART ###
#################

xwayland {
  force_zero_scaling = true
}

exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = systemctl --user start hyprpolkitagent
#exec-once = hypridle
exec-once = waybar 


# set a random wallpaper at start and start hyprpaper
exec-once = awww-daemon && awww img -o eDP-1 ~.config/wallpapers/fingers.jpg && awww img -o HDMI-A-1 ~.config/wallpapers/fingers.jpg
